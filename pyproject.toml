[project]
name = "BondVaut_PK"

version = "0.1.0"

description = """
Manage Pakistani prize-bond lists and user sessions.
Users and administrators sign in with separate endpoints and receive JWT bearer access tokens. Authenticated API calls renew the idle expiry; clients must store the replacement token from the X-Access-Token response header. Tokens expire after the configured idle timeout.
"""

summary = "Manage prize-bond lists and authenticated user sessions."

readme = "README.md"

authors = [
    { name = "Muhammad Awais Bilal", email = "mab4605@gmail.com"},
    ]
licence = {name = "MIT License", "identifier" = "MIT", url = "https://wolf4605.github.io/bondvaultpk.github.io/"}

initialize_db = false

requires-python = ">=3.14"

dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.150.0",
    "PyJWT>=2.10.1",
    "scalar-fastapi>=1.9.1",
]

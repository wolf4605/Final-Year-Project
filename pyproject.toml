[project]
name = "BondVaut_PK"

version = "0.1.0"

description = "Manage Pakistani prize-bond lists and user sessions.\nRegister an account and sign in to receive bearer access and refresh tokens. Send the access token in the `Authorization: Bearer <token>` header to use protected user and bond operations. Refresh and logout operations use a refresh token in the request body. User refresh and logout routes also require an active user access token.\nAdministrator authentication is provided separately. Sessions expire after 15 minutes without activity, and active sessions are cleared when the application process restarts."

summary = "Manage prize-bond lists and authenticated user sessions."

readme = "README.md"

authors = [
    { name = "Muhammad Awais Bilal", email = "mab4605@gmail.com"},
    ]
licence = {name = "MIT License", "identifier" = "MIT", url = "https://wolf4605.github.io/bondvaultpk.github.io/"}

initialize_db = false

requires-python = ">=3.14"

dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.150.0",
    "scalar-fastapi>=1.9.1",
]
